<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wireframe – Home (single viewport, no scroll)</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    color: #fff;
    background: #000;
  }
  a { color: inherit; text-decoration: none; }

  .home {
    position: relative;
    height: 100vh;
    width: 100%;
    overflow: hidden;
  }

  /* full-bleed slika */
  .home-image {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      45deg,
      #1a1a1a,
      #1a1a1a 30px,
      #232323 30px,
      #232323 60px
    );
    display: flex;
    align-items: center;
    justify-content: center;
    color: #555;
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  /* subtilen vertikalen overlay za berljivost */
  .home-image::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,0.55) 0%,
      rgba(0,0,0,0.15) 25%,
      rgba(0,0,0,0.15) 65%,
      rgba(0,0,0,0.75) 100%
    );
    pointer-events: none;
  }

  /* TOP BAR – logo + utility */
  .top {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 32px 48px;
    z-index: 10;
  }
  .logo {
    display: flex;
    flex-direction: column;
    line-height: 1;
  }
  .logo-name {
    font-weight: 700;
    letter-spacing: 6px;
    font-size: 32px;
    text-transform: uppercase;
  }
  .logo-tag {
    font-weight: 400;
    letter-spacing: 8px;
    font-size: 11px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.75);
    margin-top: 8px;
    padding-left: 2px;
  }
  .utility {
    display: flex;
    gap: 28px;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.85);
  }
  .utility a {
    border-bottom: 1px solid transparent;
    padding-bottom: 2px;
    transition: border-color 0.2s ease;
  }
  .utility a:hover { border-bottom-color: #fff; }

  /* CENTER TAGLINE (opcijsko, lahko se odstrani) */
  .tagline {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 5;
  }
  .tagline p {
    margin: 0;
    font-size: 11px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.7);
  }

  /* KATEGORIJE – glavni interaktivni element */
  .categories {
    position: absolute;
    bottom: 18%;
    left: 0; right: 0;
    text-align: center;
    z-index: 10;
  }
  .categories ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: inline-flex;
    gap: 48px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .categories a {
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 500;
    border-bottom: 1px solid transparent;
    padding-bottom: 6px;
    transition: border-color 0.2s ease, opacity 0.2s ease;
  }
  .categories a:hover {
    border-bottom-color: #fff;
  }
  /* ko hover-aš kategorijo, ostale rahlo zatemnimo */
  .categories ul:hover a:not(:hover) {
    opacity: 0.45;
  }

  /* BOTTOM BAR – copyright + socials */
  .bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px 48px;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    z-index: 10;
  }

  /* WIREFRAME OZNAKA */
  .label {
    position: absolute;
    font-size: 10px;
    color: #c00;
    background: #fff;
    padding: 3px 8px;
    border: 1px solid #c00;
    letter-spacing: 1px;
    text-transform: uppercase;
    z-index: 100;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
  }

  /* RESPONSIVE */
  @media (max-width: 700px) {
    .top, .bottom { padding: 20px 24px; }
    .categories ul { gap: 24px; flex-direction: column; align-items: center; }
    .categories a { font-size: 16px; }
    .utility { gap: 16px; font-size: 10px; }
    .logo-name { font-size: 22px; letter-spacing: 4px; }
    .logo-tag { font-size: 9px; letter-spacing: 5px; margin-top: 6px; }
  }
</style>
</head>
<body>

<div class="home">
  <span class="label">[ HOME · 100vh · NO SCROLL ]</span>

  <!-- FULL-BLEED HERO SLIKA -->
  <div class="home-image">[ ENA SAMA SIGNATURE FOTOGRAFIJA – full bleed, fills viewport ]</div>

  <!-- TOP BAR -->
  <header class="top">
    <div class="logo">
      <span class="logo-name">Jan Uršič</span>
      <span class="logo-tag">Photography</span>
    </div>
    <nav class="utility">
      <a>About</a>
      <a>Contact</a>
    </nav>
  </header>

  <!-- CENTER TAGLINE (lahko odstraniš) -->
  <div class="tagline">
    <p>Foto produkcija · Slovenija</p>
  </div>

  <!-- KATEGORIJE -->
  <nav class="categories">
    <ul>
      <li><a href="#sport">Šport</a></li>
      <li><a href="#komercialno">Komercialno</a></li>
      <li><a href="#dogodki">Dogodki</a></li>
      <li><a href="#koncerti">Koncerti</a></li>
      <li><a href="#avtomoto">Avtomoto</a></li>
    </ul>
  </nav>

  <!-- BOTTOM -->
  <footer class="bottom">
    <span>© 2026 Jan Uršič</span>
    <span>IG · Behance · Vimeo</span>
  </footer>
</div>

</body>
</html>
